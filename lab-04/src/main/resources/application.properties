server.address=127.0.0.1
server.port=8083
server.servlet.context-path=/catalog
server.servlet.session.tracking-modes=cookie

spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://127.0.0.1:15432/catalog_jms}
spring.datasource.username=${CATALOG_DB_USER:catalog}
spring.datasource.password=${CATALOG_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.artemis.mode=embedded
spring.artemis.embedded.persistent=true
spring.artemis.embedded.data-directory=${CATALOG_BROKER_DIR:build/artemis}
spring.artemis.embedded.queues=catalog.audit,catalog.notify
spring.mail.host=${CATALOG_SMTP_HOST:127.0.0.1}
spring.mail.port=${CATALOG_SMTP_PORT:11025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
catalog.mail.sender=${CATALOG_MAIL_SENDER:catalog@example.invalid}
catalog.mail.recipients=${CATALOG_MAIL_RECIPIENTS:lab@example.invalid}
