server.address=127.0.0.1
server.port=8081
server.servlet.context-path=/catalog
server.servlet.session.tracking-modes=cookie

spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://127.0.0.1:15432/catalog_spring}
spring.datasource.username=${CATALOG_DB_USER:catalog}
spring.datasource.password=${CATALOG_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
